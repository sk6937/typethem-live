<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tt-bubble" x1="10" y1="10" x2="54" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B3BE0"/>
      <stop offset="1" stop-color="#2D5BE0"/>
    </linearGradient>
    <linearGradient id="tt-bar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B3BE0"/>
      <stop offset="1" stop-color="#2D5BE0"/>
    </linearGradient>
  </defs>

  <!-- paper background -->
  <rect width="1200" height="630" fill="#F5F6F8"/>

  <!-- brand mark: speech bubble + "t", scaled from the 64px logo -->
  <g transform="translate(96,86) scale(2.9)">
    <g stroke="#6C7BF5" stroke-width="3" stroke-linecap="round">
      <line x1="32" y1="1.5" x2="32" y2="6.5"/>
      <line x1="24.5" y1="3.5" x2="27" y2="7.5"/>
      <line x1="39.5" y1="3.5" x2="37" y2="7.5"/>
    </g>
    <path fill="url(#tt-bubble)" d="M21 9.5h22a13 13 0 0 1 13 13v11a13 13 0 0 1-13 13h-7.5l-6.7 8.4a1.4 1.4 0 0 1-2.5-.9V46.5H21a13 13 0 0 1-13-13v-11a13 13 0 0 1 13-13z"/>
    <g fill="#FFFFFF">
      <rect x="29.4" y="16.5" width="5.6" height="24" rx="2.8"/>
      <rect x="23.5" y="21.8" width="17" height="5" rx="2.5"/>
      <path d="M35 35.5c0 3 1.9 4.6 4.7 4.6v-4.8c-.9 0-1.3-.5-1.3-1.5v-1.3H35v3z"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="330" y="205" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="700" fill="#16181D" letter-spacing="-2">TypeThem</text>

  <!-- headline -->
  <text x="98" y="360" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#16181D" letter-spacing="-1">Copy, paste &amp; type any</text>
  <text x="98" y="430" font-family="'Space Grotesk','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="#2D3BE0" letter-spacing="-1">symbol, accent or emoji</text>

  <!-- glyph strip -->
  <text x="98" y="545" font-family="'Helvetica Neue',Arial,sans-serif" font-size="66" fill="#16181D" letter-spacing="8">é  ∞  ★  ½  ©  →  ✓  €  ñ  ∑</text>

  <!-- brand accent bar -->
  <rect x="0" y="614" width="1200" height="16" fill="url(#tt-bar)"/>
</svg>
